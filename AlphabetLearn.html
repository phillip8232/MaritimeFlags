<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alphabet Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark-blue: #00072D;
      --navy: #001f4c;
      --gold: #FFD700;
      --silver: #C0C0C0;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--dark-blue);
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: var(--gold);
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .card {
      border: 4px solid var(--gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      padding: 20px;
      margin: 20px;
      background-color: var(--navy);
      border-radius: 12px;
      width: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flag-img {
      height: 128px;
      width: 128px;
      margin-bottom: 15px;
    }

    .info {
      text-align: center;
    }

    .info p {
      margin: 6px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }
  </style>
  <script>
    const flags = [
      "ALPHA", "BRAVO", "CHARLIE", "DELTA", "ECHO", "FOXTROT", "GOLF", "HOTEL",
      "INDIA", "JULIET", "KILO", "LIMA", "MIKE", "NOVEMBER", "OSCAR", "PAPA",
      "QUEBEC", "ROMEO", "SIERRA", "TANGO", "UNIFORM", "VICTOR", "WHISKEY",
      "XRAY", "YANKEE", "ZULU"
    ];

    const morse = [
      ".-", "-...", "-.-.", "-..", ".", "..-.", "--.", "....",
      "..", ".---", "-.-", ".-..", "--", "-.", "---", ".--.",
      "--.-", ".-.", "...", "-", "..-", "...-", ".--",
      "-..-", "-.--", "--.."
    ];

    const descriptions = [
      "I have a diver down; keep well clear at slow speed.",
      "I am taking in, discharging, or carrying dangerous goods.",
      "Yes (affirmative).",
      "Keep clear of me; I am maneuvering with difficulty.",
      "I am altering my course to starboard.",
      "I am disabled; communicate with me.",
      "I require a pilot.",
      "I have a pilot on board.",
      "I am altering my course to port.",
      "I am on fire and have dangerous cargo; keep clear.",
      "I wish to communicate with you.",
      "You should stop your vessel instantly.",
      "My vessel is stopped; making no way through the water.",
      "No (negative).",
      "Man overboard.",
      "In harbour: All persons should report on board. At sea: It may be used by fishing vessels to mean: “My nets have come fast upon an obstruction.”",
      "My vessel is ‘healthy’ and I request free pratique.",
      "I have received your signal.",
      "I am operating astern propulsion.",
      "Keep clear of me; I am engaged in pair trawling.",
      "You are running into danger.",
      "I require assistance.",
      "I require medical assistance.",
      "Stop carrying out your intentions and watch for my signals.",
      "I am dragging my anchor.",
      "I require a tug.",
    ];

    window.onload = function() {
      const grid = document.getElementById("grid");
      for (let i = 0; i < flags.length; i++) {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.className = "flag-img";
        img.src = `https://github.com/phillip8232/MaritimeFlags/blob/main/MARITIME_FLAGS/${flags[i]}.png`;
        img.alt = flags[i];

        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = `
          <p><strong>${flags[i]}</strong></p>
          <p>Morse: ${morse[i]}</p>
          <p>${descriptions[i]}</p>
        `;

        card.appendChild(img);
        card.appendChild(info);
        grid.appendChild(card);
      }
    }
  </script>
</head>
<body>
  <h1>Alpha - Zulu</h1>
  <div id="grid" class="grid"></div>
</body>
</html>
