<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number & Pennant Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark-blue: #00072D;
      --navy: #001f4c;
      --gold: #FFD700;
      --silver: #C0C0C0;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--dark-blue);
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: var(--gold);
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .card {
      border: 4px solid var(--gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      padding: 20px;
      margin: 20px;
      background-color: var(--navy);
      border-radius: 12px;
      width: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flag-img {
      height: 128px;
      width: 128px;
      margin-bottom: 15px;
      object-fit: contain; /* Ensures pennants fit well */
    }

    .info {
      text-align: center;
    }

    .info p {
      margin: 6px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }
  </style>
  <script>
    // Combining the flags (1-9) and Pennants (P0-P9) from your Num.html logic
    const flags = [
      "1", "2", "3", "4", "5", "6", "7", "8", "9"
    ];

    const morse = [
      ".----", "..---", "...--", "....-", ".....", "-....", "--...", "---..", "----."
    ];

    const descriptions = [
      "Numeral 1", "Numeral 2", "Numeral 3", "Numeral 4", "Numeral 5", 
      "Numeral 6", "Numeral 7", "Numeral 8", "Numeral 9"
    ];

    window.onload = function() {
      const grid = document.getElementById("grid");
      for (let i = 0; i < flags.length; i++) {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.className = "flag-img";
        // Using the same path convention as your other files
        img.src = `https://github.com/phillip8232/MaritimeFlags/blob/main/MARITIME_FLAGS/${flags[i]}.png`;
        img.alt = flags[i];

        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = `
          <p><strong>${flags[i]}</strong></p>
          <p>Morse: ${morse[i]}</p>
          <p>${descriptions[i]}</p>
        `;

        card.appendChild(img);
        card.appendChild(info);
        grid.appendChild(card);
      }
    }
  </script>
</head>
<body>
  <h1>Numbers</h1>
  <div id="grid" class="grid"></div>
</body>
</html>
